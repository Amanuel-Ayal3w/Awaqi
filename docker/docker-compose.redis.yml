# Redis + RQ Dashboard (local dev / infra).
#
# From repo root:
#   docker compose -f docker/docker-compose.redis.yml up -d
#
# Full stack still uses docker-compose.yml, which includes this file.
#
# RQ Dashboard is available at http://localhost:9181
# It shows all queues (scraper, ingest), jobs, workers, and failed jobs.

services:
  redis:
    image: redis:7-alpine
    container_name: awaqi-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - awaqi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    container_name: awaqi-rq-dashboard
    ports:
      - "${RQ_DASHBOARD_PORT:-9181}:9181"
    environment:
      RQ_DASHBOARD_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  awaqi_redis_data:
    name: awaqi_redis_data
