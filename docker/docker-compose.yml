# Full stack: PostgreSQL (pgvector) + Redis + API + Web + Telegram bot.
#
# DB only:
#   docker compose -f docker/docker-compose.db.yml up -d
#
# Redis only:
#   docker compose -f docker/docker-compose.redis.yml up -d
#
# DB + Redis (local dev, no app containers):
#   docker compose -f docker/docker-compose.yml up -d db redis
#
# Everything:
#   docker compose -f docker/docker-compose.yml up --build

include:
  - docker-compose.db.yml
  - docker-compose.redis.yml

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-awaqi_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3100"
    env_file:
      - ../.env
    environment:
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-awaqi_db}
    depends_on:
      - api

  telegram_bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-awaqi_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
