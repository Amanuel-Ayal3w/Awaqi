[project]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram bot service for Awaqi (@ERATaxBot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0",
    "python-dotenv>=1.0",
    "database",
]

[tool.uv.sources]
database = { workspace = true }

[project.scripts]
telegram-bot = "telegram_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot"]
