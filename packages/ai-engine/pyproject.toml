[project]
name = "ai-engine"
version = "0.1.0"
description = "Core AI logic for Awaqi"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pypdf",
    "numpy",
    "database",
    "utils",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pytesseract>=0.3.10",
    "pillow>=10.3.0",
    "httpx>=0.27.0",
    "telethon>=1.37.0",
    "python-pptx>=1.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[tool.uv.sources]
database = { workspace = true }
utils = { workspace = true }
